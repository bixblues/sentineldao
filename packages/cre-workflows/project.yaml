# ==========================================================================
# SentinelDAO CRE Project
# ==========================================================================
# Automated vault defense workflows powered by Chainlink CRE.
# Monitors ProtectedVault contracts across multiple chains for
# suspicious activity and triggers defensive actions.
#
# Capabilities used:
#   - EVM Log Trigger: Watch Deposit, Withdrawal, EmergencyPause events
#   - HTTP Capability: POST threat data to backend webhook (DON consensus)
#   - EVM Read/Write: Read vault state, write defense reports on-chain
#
# Multi-chain: Sepolia, Arbitrum Sepolia, Base Sepolia

