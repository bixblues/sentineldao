# ==========================================================================
# SentinelDAO CRE Workflow Settings
# ==========================================================================
# Monitors ProtectedVault contracts for suspicious activity using
# EVM Log Triggers. When threats are detected, the workflow:
#   1. Decodes and analyzes the event (threshold-based severity)
#   2. POSTs threat data to backend via HTTP capability (DON consensus)
#   3. Backend runs complex pattern detection (flash loan, TVL drain, etc.)
#
# Capabilities:
#   - EVM Log Trigger (3x): Deposit, Withdrawal, EmergencyPause
#   - HTTP Client: POST webhook notifications with DON consensus
#
# This replaces the custom backend indexer with decentralized,
# consensus-verified event detection powered by the CRE DON.

# ==========================================================================
staging-settings:
  user-workflow:
    workflow-name: "sentinel-defense-staging"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.staging.json"
    secrets-path: ""

# ==========================================================================
production-settings:
  user-workflow:
    workflow-name: "sentinel-defense-production"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.production.json"
    secrets-path: ""
